<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow &amp; Style – Order on WhatsApp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#14211b;--mu:#667069;--bd:#e3e7e2;--ac:#0e7a43;--on:#fff;--gold:#f2b705;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1311;--card:#181d1a;--tx:#eef2ee;--mu:#9aa59d;--bd:#28302b}}
:root[data-theme="dark"]{--bg:#0f1311;--card:#181d1a;--tx:#eef2ee;--mu:#9aa59d;--bd:#28302b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.pr{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ac);color:var(--on);padding:20px 16px 18px}
.w{max-width:960px;margin:0 auto}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.tb{background:var(--gold);color:#1d1600;font-size:13px;font-weight:500;padding:7px 16px;text-align:center}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--bd)}
.bar input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px;padding-bottom:110px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:110px;display:grid;place-items:center;font-size:46px;position:relative}
.so{position:absolute;inset:auto 8px 8px auto;background:#14211b;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb b{font-weight:700}.pb small{color:var(--mu)}
.pr{font-weight:800;font-size:17px}
.pb select{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wa{background:var(--wa);color:#04210f;width:100%;padding:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
.fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:928px;margin:auto;display:flex;justify-content:space-between;padding:15px 18px;border-radius:14px;font-size:16px;z-index:6}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none}
.sh.o{display:block}
.pn{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pn h2{margin:0 0 10px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.ci div:first-child{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
label{display:block;font-weight:500;margin:12px 0 4px}
.pn input,.pn textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0}
.mo{background:var(--bg);border:1px dashed var(--ac);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.x{float:right;background:none;border:0;font-size:24px;cursor:pointer}
.lk{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;place-items:center;padding:20px}
.lk.o{display:grid}.lk div{max-width:380px;text-align:center}
.lk input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);text-align:center;letter-spacing:1px;margin:12px 0}
.er{color:#c0392b;min-height:20px;font-size:14px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 16px 120px}
[hidden]{display:none!important}
</style></head><body>
<header><div class="w"><h1 id="nm"></h1><p id="tg"></p></div></header>
<div class="tb" id="tb" hidden></div>
<div class="bar"><div class="w"><input id="q" type="search" placeholder="Search products"><div class="chips" id="cats"></div></div></div>
<main class="w"><div class="grid" id="gr"></div></main>
<footer id="ft"></footer>
<button class="btn fab" id="fab" hidden><span id="fc"></span><span id="ft2"></span></button>

<div class="sh" id="sh"><div class="pn">
<button class="x" id="cl" aria-label="Close">×</button><h2>Your order</h2>
<div id="ci"></div>
<div class="tot"><span>Total</span><span id="tt"></span></div>
<label>Your name</label><input id="cn" placeholder="e.g. Ama Mensah" autocomplete="name">
<label>Phone number</label><input id="cp" type="tel" placeholder="024 000 0000" autocomplete="tel">
<label>How do you want to receive it?</label>
<div class="seg"><button class="chip on" data-m="Delivery">Delivery</button><button class="chip" data-m="Pickup">Pickup</button></div>
<div id="lw"><label>Delivery location</label><input id="cl2" placeholder="Area, landmark or address"></div>
<label>Note (optional)</label><textarea id="cno" rows="2" placeholder="Anything we should know?"></textarea>
<div class="mo" id="mo" hidden></div>
<p class="er" id="ce"></p>
<button class="btn wa" id="sd">Send order on WhatsApp</button>
</div></div>

<div class="lk" id="lk"><div>
<h1 style="font-family:'Bricolage Grotesque',sans-serif;margin:0 0 6px">Free trial ended</h1>
<p style="color:var(--mu)">Enter your activation code to keep this store open.</p>
<input id="ac" placeholder="STORE-P-20271231-ABC123" autocapitalize="characters">
<p class="er" id="ae"></p>
<button class="btn" id="ab" style="width:100%">Activate store</button>
<p><a id="sp" style="color:var(--ac)" target="_blank" rel="noopener">Get a code on WhatsApp</a></p>
</div></div>

<script>
/* ===== PER-CLIENT SETTINGS: edit this block for each new client ===== */
const C={sheet:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYEHfMvvygW3Ik-vrkBriUuVVdAZmpL2ybvEWoNoODHJWEDGhtxtKyLS-_-KTjEON5T6uRWeeq-fBV/pub?gid=0&single=true&output=csv',id:'GLOW',name:'Glow & Style',tagline:'Fashion, beauty and phone accessories',color:'#0e7a43',
whatsapp:'+233500661961',support:'+233500661961',trialStart:'2026-11-10',trialDays:90,
momo:{network:'MTN MoMo',number:'024 000 0000',name:'Glow & Style'},
products:[
{n:'Ankara Wrap Dress',c:'Boutique',p:180,e:'👗',bg:'#fde2d4',d:'Free size, lined',o:['S','M','L','XL']},
{n:'Leather Slides',c:'Boutique',p:95,e:'🩴',bg:'#e6dcc8',d:'Handmade in Kumasi',o:['40','41','42','43']},
{n:'Shea Body Butter',c:'Cosmetics',p:45,e:'🧴',bg:'#f7ecc4',d:'250g, unscented'},
{n:'Matte Lipstick',c:'Cosmetics',p:35,e:'💄',bg:'#f8d3dc',d:'Long wear',o:['Rose','Plum','Nude']},
{n:'Fast Charger 20W',c:'Phone accessories',p:70,e:'🔌',bg:'#d9e8f7',d:'Type-C, 1 year warranty'},
{n:'Phone Case',c:'Phone accessories',p:40,e:'📱',bg:'#dcefe2',d:'Shockproof',o:['iPhone 13','iPhone 14','Samsung A54'],out:true},
{n:'Gari 1kg',c:'Provisions',p:15,e:'🌾',bg:'#f3ead2',d:'Fine, stone free'},
{n:'Palm Oil 1L',c:'Provisions',p:35,e:'🫒',bg:'#fbe0c3',d:'Fresh, unbleached'}]};
/* ===== SECRET: must match your generator file. Change before selling ===== */
const SECRET='change-me-2026';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),cur='GH₵',fmt=n=>cur+n.toLocaleString('en-GH');
const hs=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36).toUpperCase().slice(-6)};
const KEY='cc_'+C.id;
function parse(code){const t=(code||'').trim().toUpperCase().split('-');if(t.length!==4)return null;const[i,tr,d,k]=t;
if(i!==C.id||!/^\d{8}$/.test(d)||!'BP'.includes(tr)||hs([i,tr,d,SECRET].join('|'))!==k)return null;
return{tier:tr,exp:new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6),23,59,59)}}
function status(){const t=new Date(C.trialStart+'T00:00:00');t.setDate(t.getDate()+C.trialDays);const now=new Date();
let l=null;try{l=parse(localStorage.getItem(KEY))}catch(e){}
if(l&&l.exp>now)return{ok:1,tier:l.tier,paid:1,exp:l.exp};
if(t>now)return{ok:1,tier:'P',paid:0,exp:t};return{ok:0}}
let S=status(),cart=[],cat='All',mode='Delivery';
function boot(){document.documentElement.style.setProperty('--ac',C.color);
$('nm').textContent=C.name;$('tg').textContent=C.tagline;document.title=C.name+' – Order on WhatsApp';
$('sp').href='https://wa.me/'+C.support+'?text='+encodeURIComponent('Hello, I want an activation code for '+C.name+' ('+C.id+').');
$('lk').classList.toggle('o',!S.ok);
if(S.ok&&!S.paid){const d=Math.ceil((S.exp-new Date())/864e5);$('tb').hidden=false;$('tb').textContent='Free trial: '+d+' day'+(d==1?'':'s')+' left';$('ft').textContent='Powered by ChatCart'}
if(S.tier==='P'){$('mo').hidden=false;$('mo').innerHTML='<b>Pay with '+C.momo.network+'</b><br>'+C.momo.number+' · '+C.momo.name+'<br><small>Send payment, then share the screenshot on WhatsApp.</small>'}
const cs=['All',...new Set(C.products.map(p=>p.c))];
$('cats').innerHTML=cs.map(c=>'<button class="chip'+(c==cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');draw()}
function draw(){const q=$('q').value.toLowerCase();
const L=C.products.map((p,i)=>({...p,i})).filter(p=>(cat=='All'||p.c==cat)&&(p.n+p.d).toLowerCase().includes(q));
$('gr').innerHTML=L.length?L.map(p=>'<div class="p"><div class="ph" style="background:'+p.bg+'">'+p.e+(p.img?'<img src="'+esc(p.img)+'" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">':'')+(p.out?'<span class="so">Sold out</span>':'')+'</div><div class="pb"><b>'+esc(p.n)+'</b><small>'+esc(p.d)+'</small>'+(p.o?'<select id="o'+p.i+'">'+p.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':'')+'<span class="pr">'+fmt(p.p)+'</span><button class="btn" data-a="'+p.i+'"'+(p.out?' disabled':'')+'>'+(p.out?'Sold out':'Add to order')+'</button></div></div>').join(''):'<div class="empty">No products found. Try another search.</div>'}
function bar(){const n=cart.reduce((s,x)=>s+x.q,0),t=cart.reduce((s,x)=>s+x.q*C.products[x.i].p,0);
$('fab').hidden=!n;$('fc').textContent='View order ('+n+')';$('ft2').textContent=fmt(t);$('tt').textContent=fmt(t);
$('ci').innerHTML=cart.length?cart.map((x,k)=>{const p=C.products[x.i];return'<div class="ci"><div><b>'+esc(p.n)+'</b>'+(x.o?'<br><small>'+esc(x.o)+'</small>':'')+'</div><div class="q"><button data-d="'+k+'">−</button>'+x.q+'<button data-u="'+k+'">+</button></div><b>'+fmt(p.p*x.q)+'</b></div>'}).join(''):'<p class="empty">Your order is empty.</p>';return t}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.c){cat=t.dataset.c;boot()}
if(t.dataset.a){const i=+t.dataset.a,s=$('o'+i),o=s?s.value:'',f=cart.find(x=>x.i==i&&x.o==o);f?f.q++:cart.push({i,o,q:1});bar()}
if(t.dataset.u)cart[+t.dataset.u].q++,bar();
if(t.dataset.d){const k=+t.dataset.d;if(--cart[k].q<1)cart.splice(k,1);bar()}
if(t.dataset.m){mode=t.dataset.m;document.querySelectorAll('.seg .chip').forEach(c=>c.classList.toggle('on',c==t));$('lw').hidden=mode=='Pickup'}});
$('q').oninput=draw;$('fab').onclick=()=>{bar();$('sh').classList.add('o')};$('cl').onclick=()=>$('sh').classList.remove('o');
$('sh').onclick=e=>{if(e.target==$('sh'))$('sh').classList.remove('o')};
$('sd').onclick=()=>{S=status();if(!S.ok){location.reload();return}
const nm=$('cn').value.trim(),ph=$('cp').value.trim(),lo=$('cl2').value.trim();
if(!cart.length)return $('ce').textContent='Add at least one product.';
if(!nm||!ph)return $('ce').textContent='Enter your name and phone number.';
if(mode=='Delivery'&&!lo)return $('ce').textContent='Enter your delivery location.';
$('ce').textContent='';const t=bar();
let m='*New order – '+C.name+'*\n\n'+cart.map((x,k)=>{const p=C.products[x.i];return(k+1)+'. '+p.n+(x.o?' ('+x.o+')':'')+' x'+x.q+' – '+fmt(p.p*x.q)}).join('\n')+'\n\n*Total: '+fmt(t)+'*\n\nName: '+nm+'\nPhone: '+ph+'\n'+mode+(mode=='Delivery'?': '+lo:'')+($('cno').value.trim()?'\nNote: '+$('cno').value.trim():'')+(S.tier=='P'?'\nPayment: '+C.momo.network:'');
window.open('https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(m),'_blank')};
$('ab').onclick=()=>{const v=parse($('ac').value);if(!v||v.exp<new Date()){$('ae').textContent='This code is not valid for this store or has expired.';return}
try{localStorage.setItem(KEY,$('ac').value.trim().toUpperCase())}catch(e){}S=status();$('ae').textContent='';boot()};
function csv(t){const r=[];let w=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=0;else f+=c}else if(c=='"')q=1;else if(c==','){w.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;w.push(f);r.push(w);w=[];f=''}else f+=c}if(f||w.length){w.push(f);r.push(w)}return r}
function warn(e){const d=document.createElement('div');d.style.cssText='background:#c0392b;color:#fff;padding:8px 16px;text-align:center;font-size:13px';d.textContent='Could not load the product sheet ('+(e&&e.message||'no products found')+'). Showing saved or sample products.';document.body.prepend(d)}
async function load(){if(C.sheet){try{const t=await(await fetch(C.sheet)).text();const R=csv(t).slice(1).filter(x=>x[0]&&x[0].trim());
if(R.length){C.products=R.map(x=>({n:x[0].trim(),c:(x[1]||'General').trim(),p:parseFloat(x[2])||0,d:(x[3]||'').trim(),o:x[4]?x[4].split('|').map(z=>z.trim()).filter(Boolean):null,img:(x[5]||'').trim(),out:/^(yes|y|true|sold)/i.test((x[6]||'').trim()),e:'🛍️',bg:'#e9eeea'}));try{localStorage.setItem(KEY+'_p',JSON.stringify(C.products))}catch(e){}}else warn()}
catch(e){warn(e);try{const z=JSON.parse(localStorage.getItem(KEY+'_p'));if(z&&z.length)C.products=z}catch(e2){}}}boot();bar()}
load();
</script></body></html>
